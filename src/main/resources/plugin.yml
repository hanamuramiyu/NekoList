name: NekoList
version: 2.0.0
main: hanamuramiyu.pawkin.net.core.NekoList
description: Advanced whitelist system
author: Hanamura Miyu
api-version: '1.21'
folia-supported: true
load: POSTWORLD
load-before: []
depend: []
soft-depend: []

permissions:
  nekolist.use:
    description: Allows using whitelist commands
    default: op
  nekolist.bypass:
    description: Bypasses whitelist checks
    default: op
  nekolist.admin:
    description: Full access to all NekoList features
    default: op
    children:
      nekolist.use: true
      nekolist.bypass: true

commands:
  whitelist:
    description: Manage whitelist
    usage: /whitelist <help|reload|on|off|list|add|remove>
    aliases: [wl]
    permission: nekolist.use