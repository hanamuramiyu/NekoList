usage: |
  <gold>NekoList Commands:
  <yellow>/whitelist help</yellow> <gray>- Show this help
  <yellow>/whitelist on</yellow> <gray>- Enable whitelist
  <yellow>/whitelist off</yellow> <gray>- Disable whitelist
  <yellow>/whitelist list</yellow> <gray>- Show whitelisted players
  <yellow>/whitelist add <player></yellow> <gray>- Add player to whitelist
  <yellow>/whitelist remove <player></yellow> <gray>- Remove player from whitelist
  <yellow>/whitelist reload</yellow> <gray>- Reload configuration

