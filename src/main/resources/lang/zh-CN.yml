usage: |
  <gold>NekoList 命令:
  <yellow>/whitelist help</yellow> <gray>- 显示此帮助
  <yellow>/whitelist on</yellow> <gray>- 启用白名单
  <yellow>/whitelist off</yellow> <gray>- 禁用白名单
  <yellow>/whitelist list</yellow> <gray>- 显示白名单玩家
  <yellow>/whitelist add <player></yellow> <gray>- 添加玩家到白名单
  <yellow>/whitelist remove <player></yellow> <gray>- 从白名单移除玩家
  <yellow>/whitelist reload</yellow> <gray>- 重载配置

