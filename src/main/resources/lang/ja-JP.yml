usage: |
  <gold>NekoList コマンド:
  <yellow>/whitelist help</yellow> <gray>- このヘルプを表示
  <yellow>/whitelist on</yellow> <gray>- ホワイトリストを有効化
  <yellow>/whitelist off</yellow> <gray>- ホワイトリストを無効化
  <yellow>/whitelist list</yellow> <gray>- ホワイトリスト登録プレイヤーを表示
  <yellow>/whitelist add <player></yellow> <gray>- プレイヤーをホワイトリストに追加
  <yellow>/whitelist remove <player></yellow> <gray>- プレイヤーをホワイトリストから削除
  <yellow>/whitelist reload</yellow> <gray>- 設定をリロード

