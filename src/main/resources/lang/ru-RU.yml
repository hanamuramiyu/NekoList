usage: |
  <gold>Команды NekoList:
  <yellow>/whitelist help</yellow> <gray>- Показать эту справку
  <yellow>/whitelist on</yellow> <gray>- Включить белый список
  <yellow>/whitelist off</yellow> <gray>- Выключить белый список
  <yellow>/whitelist list</yellow> <gray>- Показать игроков в белом списке
  <yellow>/whitelist add <player></yellow> <gray>- Добавить игрока в белый список
  <yellow>/whitelist remove <player></yellow> <gray>- Удалить игрока из белого списка
  <yellow>/whitelist reload</yellow> <gray>- Перезагрузить конфигурацию

