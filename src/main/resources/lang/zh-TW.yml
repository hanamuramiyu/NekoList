usage: |
  <gold>NekoList 指令:
  <yellow>/whitelist help</yellow> <gray>- 顯示此說明
  <yellow>/whitelist on</yellow> <gray>- 啟用白名單
  <yellow>/whitelist off</yellow> <gray>- 停用白名單
  <yellow>/whitelist list</yellow> <gray>- 顯示白名單玩家
  <yellow>/whitelist add <player></yellow> <gray>- 新增玩家至白名單
  <yellow>/whitelist remove <player></yellow> <gray>- 從白名單移除玩家
  <yellow>/whitelist reload</yellow> <gray>- 重新載入設定

