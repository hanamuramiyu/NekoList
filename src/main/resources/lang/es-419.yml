usage: |
  <gold>Comandos de NekoList:
  <yellow>/whitelist help</yellow> <gray>- Mostrar esta ayuda
  <yellow>/whitelist on</yellow> <gray>- Activar lista blanca
  <yellow>/whitelist off</yellow> <gray>- Desactivar lista blanca
  <yellow>/whitelist list</yellow> <gray>- Mostrar jugadores en lista blanca
  <yellow>/whitelist add <player></yellow> <gray>- Añadir jugador a lista blanca
  <yellow>/whitelist remove <player></yellow> <gray>- Remover jugador de lista blanca
  <yellow>/whitelist reload</yellow> <gray>- Recargar configuración

