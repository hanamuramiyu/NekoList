usage: |
  <gold>Команди NekoList:
  <yellow>/whitelist help</yellow> <gray>- Показати цю довідку
  <yellow>/whitelist on</yellow> <gray>- Увімкнути білий список
  <yellow>/whitelist off</yellow> <gray>- Вимкнути білий список
  <yellow>/whitelist list</yellow> <gray>- Показати гравців у білому списку
  <yellow>/whitelist add <player></yellow> <gray>- Додати гравця до білого списку
  <yellow>/whitelist remove <player></yellow> <gray>- Видалити гравця з білого списку
  <yellow>/whitelist reload</yellow> <gray>- Перезавантажити конфігурацію

